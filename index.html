<!DOCTYPE html>
<html>
<head>
  <title>Student Fee Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Student Details</h2>

    <div id="notification" class="notification hidden"></div>

    <form id="studentForm" onsubmit="saveData(event)">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-group">
        <label for="rollNo">Roll No.:</label>
        <input type="text" id="rollNo" placeholder="BCA/11111/24" required>
      </div>

      <div class="form-group">
        <label for="fee">Total Fee (in Rupees):</label>
        <input type="number" id="fee" placeholder="Rupees" required>
      </div>

      <div class="button-row">
        <div class="left-buttons">
          <button type="submit" class="btn-save">Save</button>
        </div>
        <div class="right-buttons">
          <button type="button" class="btn-clear" onclick="clearForm()">Clear</button>
          <button type="button" class="btn-delete" onclick="deleteTrigger()">Delete</button>
        </div>
      </div>
    </form>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <p>This will delete all the data of the user from the Database are you sure?</p>
      <div class="modal-buttons">
        <button type="button" class="btn-yes" onclick="confirmDelete()">Yes</button>
        <button type="button" class="btn-no" onclick="cancelDelete()">No</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
